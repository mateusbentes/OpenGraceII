[package]
name = "og2-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
vulkan = ["dep:libc"]
opengl = ["dep:libc"]
metal = ["dep:libc"]
# The D3D12 loader resolves everything through LoadLibraryA/GetProcAddress
# (kernel32 extern "system"), so it does not need the libc dlopen surface.
d3d12 = []

[target.'cfg(not(windows))'.dependencies]
# The Vulkan and the OpenGL backends dlopen() the platform's libraries and
# resolve the entry points themselves; libc is only the dlopen/dlsym
# surface, and the engine never calls into a third-party binding (lesson
# 3). Windows is not the dlopen family (the loaders use the platform's own
# LoadLibrary surface there, see each backend's cfg gates), so the
# dependency is target gated and the manifest stays warning-free on the
# windows-gnu cross-check.
libc = { version = "0.2", optional = true }

[[example]]
name = "vk_smoke"
required-features = ["vulkan"]

[[example]]
name = "gl_smoke"
required-features = ["opengl"]

[[example]]
name = "mtl_smoke"
required-features = ["metal"]

[[example]]
name = "cube_smoke_mtl"
required-features = ["metal"]

[[example]]
name = "d3d12_smoke"
required-features = ["d3d12"]
